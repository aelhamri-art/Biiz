name: BIIZ Marketing quality

on:
  pull_request:
    paths:
      - "src/components/tracking/**"
      - "src/routes/_authenticated/app.tsx"
      - "src/lib/utm.ts"
      - "drizzle/migrations/**"
      - "package.json"
      - ".github/workflows/marketing-quality.yml"
  push:
    branches:
      - "feat/biiz-marketing-v1-1"
    paths:
      - "src/components/tracking/**"
      - "src/routes/_authenticated/app.tsx"
      - "src/lib/utm.ts"
      - "drizzle/migrations/**"
      - ".github/workflows/marketing-quality.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
