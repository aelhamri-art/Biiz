name: BIIZ Sales quality

on:
  pull_request:
    paths:
      - "src/components/sales/**"
      - "src/lib/sales.ts"
      - "src/test/sales.test.ts"
      - "package.json"
      - ".github/workflows/sales-quality.yml"
  push:
    branches:
      - "feat/sales-coach-livroum-playbook-v1"
    paths:
      - "src/components/sales/**"
      - "src/lib/sales.ts"
      - "src/test/sales.test.ts"
      - ".github/workflows/sales-quality.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sales tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
